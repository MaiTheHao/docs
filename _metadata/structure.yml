# Cấu hình workspace
workspace:
    structure:
        '01_foundations':
            - 'design_patterns/'
            - 'programming_languages/'
            - 'principles/'
        '02_backend':
            - 'frameworks/'
            - 'orm_persistence/'
            - 'templating/'
        '03_frontend':
            - 'admin_templates/'
            - 'ui_frameworks/'
        '04_infrastructure':
            - 'networking/'
            - 'database/'
        '05_security':
            - 'authentication/'
            - 'best_practices/'
        '06_projects': []
        '07_templates': []
        '08_references':
            - 'cheatsheets/'
            - 'quick_guides/'
        '_archive': []

    logic:
        - { dir: '01_foundations', intent: 'Lý thuyết, nền tảng, bất biến' }
        - { dir: '02_backend', intent: 'Công nghệ backend' }
        - { dir: '03_frontend', intent: 'Công nghệ frontend' }
        - { dir: '04_infrastructure', intent: 'Hạ tầng, mạng, database' }
        - { dir: '05_security', intent: 'Bảo mật, xác thực' }
        - { dir: '06_projects', intent: 'Dự án thực tế' }
        - { dir: '07_templates', intent: 'Mẫu dự án, boilerplates' }
        - { dir: '08_references', intent: 'Tra cứu nhanh, cheatsheets' }
        - { dir: '_archive', intent: 'Lưu trữ cũ' }

    # Quy tắc đặt tên (Chỉ cho thư mục)
    conventions:
        folders:
            root: '##_snake_case (ví dụ: 01_foundations)'
            child: 'snake_case hoặc kebab-case (ví dụ: spring_boot)'
